{
  "name": "production",
  # unusuallygood.dev (packages/api/README.md, A7): the API at api.unusuallygood.dev, the editor at editor.unusuallygood.dev
  # and the apex, all on Cloudflare. After every successful cd on main, or by hand; either way the `production`
  # environment's required reviewer approves each run before anything is built or deployed, so a merge to main can't
  # ship by itself. It stays off until the repository variable PRODUCTION_DEPLOYS is `on` (the runbook's last step): a job
  # naming an environment that doesn't exist yet would create it, unprotected.
  "on": {
    "workflow_dispatch": null,
    "workflow_run": {
      "workflows": ["cd"],
      "types": ["completed"],
      "branches": ["main"]
    }
  },
  # One deploy at a time, never cancelled midway (a migration may be running). While one waits for approval, only the
  # newest run waits behind it; approving the older one ships the older commit, and the newer asks next.
  "concurrency": {
    "group": "production"
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "production": {
      "if": "${{ vars.PRODUCTION_DEPLOYS == 'on' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}",
      "runs-on": "ubuntu-latest",
      "environment": { "name": "production", "url": "https://editor.unusuallygood.dev" },
      "env": {
        "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
        "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
      },
      "steps": [
        # The commit cd shipped to Pages, not whatever main is by now (a manual run: main's head).
        { "uses": "actions/checkout@v4", "with": { "ref": "${{ github.event.workflow_run.head_sha || github.sha }}" } },
        # Only what cd already shipped: a manual run of a commit cd hasn't passed stops here.
        {
          "run": "test \"$(gh run list --workflow cd --commit \"$(git rev-parse HEAD)\" --status success --json databaseId --jq length)\" -gt 0 || { echo \"cd hasn't succeeded for $(git rev-parse HEAD)\"; exit 1; }",
          "env": { "GH_TOKEN": "${{ github.token }}" }
        },
        { "uses": "brianjenkins94/lib/.github/actions/setup@main", "with": { "workspace-packages": "packages/*,components/*,contrib" } },
        # The same build as Pages' (docs/), from the same commit.
        { "run": "pnpm run --if-present build" },
        # The API first: the site it serves signs in through it. The schema before the Worker that may need it.
        { "run": "pnpm exec wrangler d1 migrations apply editor-api --env production --remote", "working-directory": "packages/api" },
        { "run": "pnpm exec wrangler deploy --env production", "working-directory": "packages/api" },
        { "run": "pnpm exec wrangler deploy --config editor.jsonc", "working-directory": "packages/site" },
        { "run": "pnpm exec wrangler deploy", "working-directory": "packages/site" }
      ],
      "timeout-minutes": 30
    }
  }
}
