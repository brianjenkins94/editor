{
  "name": "production",
  # unusuallygood.dev (packages/api/README.md, A7): the API at api.unusuallygood.dev, the editor at editor.unusuallygood.dev,
  # the admin app at admin.unusuallygood.dev (packages/admin, B5) and the apex, all on Cloudflare. After every successful
  # cd on main, or by hand. Production promotes itself: the
  # `production` environment (main only) has no required reviewer, by choice while this is early (2026-10-16); ticking
  # Required reviewers again makes every run wait for approval. It stays off until the repository variable
  # PRODUCTION_DEPLOYS is `on`: a job naming an environment that doesn't exist yet would create it, unprotected.
  "on": {
    "workflow_dispatch": null,
    "workflow_run": {
      "workflows": ["cd"],
      "types": ["completed"],
      "branches": ["main"]
    }
  },
  # One deploy at a time, never cancelled midway (a migration may be running). A newer one waits behind it; with a
  # reviewer required, only the newest waits, and one left unapproved blocks the rest.
  "concurrency": {
    "group": "production"
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "production": {
      "if": "${{ vars.PRODUCTION_DEPLOYS == 'on' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}",
      "runs-on": "ubuntu-latest",
      "environment": { "name": "production", "url": "https://editor.unusuallygood.dev" },
      "env": {
        "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
        "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
      },
      "steps": [
        # The commit cd shipped to Pages, not whatever main is by now (a manual run: main's head).
        { "uses": "actions/checkout@v4", "with": { "ref": "${{ github.event.workflow_run.head_sha || github.sha }}" } },
        # Only what cd already shipped: a manual run of a commit cd hasn't passed stops here.
        {
          "run": "test \"$(gh run list --workflow cd --commit \"$(git rev-parse HEAD)\" --status success --json databaseId --jq length)\" -gt 0 || { echo \"cd hasn't succeeded for $(git rev-parse HEAD)\"; exit 1; }",
          "env": { "GH_TOKEN": "${{ github.token }}" }
        },
        { "uses": "brianjenkins94/lib/.github/actions/setup@main", "with": { "workspace-packages": "packages/*,components/*,contrib" } },
        # The same build as Pages' (docs/), from the same commit, with hidden source maps (packages/editor/build.ts).
        { "run": "pnpm run --if-present build", "env": { "SOURCE_MAPS": "hidden" } },
        # Those maps kept per release in R2, outside the site, for the admin app to map an editor stack through
        # (packages/api/OPERATIONS.md O7). Not fatal: without them that release's stacks only stay as they ran, and the
        # site leaves maps out either way (docs/.assetsignore).
        { "run": "node scripts/keep-source-maps.ts ../../docs $(git rev-parse --short HEAD)", "working-directory": "packages/api", "continue-on-error": true },
        # The API first: the site it serves signs in through it. The schema before the Worker that may need it.
        { "run": "pnpm exec wrangler d1 migrations apply editor-api --env production --remote", "working-directory": "packages/api" },
        # RELEASE: the commit, so an error says which release it came from (packages/api/src/errors.ts).
        { "run": "pnpm exec wrangler deploy --env production --var RELEASE:$(git rev-parse --short HEAD)", "working-directory": "packages/api" },
        { "run": "pnpm exec wrangler deploy --config editor.jsonc", "working-directory": "packages/site" },
        # The admin app's own build (packages/admin/dist; the root build doesn't make it), then its static host.
        { "run": "pnpm run build", "working-directory": "packages/admin" },
        { "run": "pnpm exec wrangler deploy --config admin.jsonc", "working-directory": "packages/site" },
        { "run": "pnpm exec wrangler deploy", "working-directory": "packages/site" }
      ],
      "timeout-minutes": 30
    }
  }
}
