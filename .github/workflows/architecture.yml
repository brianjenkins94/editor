{
  "name": "architecture",
  "on": {
    "pull_request": {
      "branches": ["main"]
    },
    "push": {
      "branches": ["main"]
    },
    "workflow_dispatch": null
  },
  # One run per branch at a time. On main a run always finishes (a newer push would otherwise cut it off partway, and
  # pushes come often), and only the latest push waits behind it — a burst of pushes is tested once, together. A pull
  # request's superseded run is cancelled.
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": "${{ github.event_name == 'pull_request' }}"
  },
  # The live architecture view's end-to-end suites (packages/editor/test/architecture-*.mjs): a real editor session in
  # headless Chromium — boot, a preview + HMR, two dev servers, a cold provoke round, a node script under the tsval
  # debugger, a webview, the git review diff, this checkout's debug-mcp, editor-contrib's extension (contrib/) loaded and
  # run — checked against the declared model. They catch
  # a wiring regression or an upstream monaco-vscode-api release (the component installs the latest) before it ships.
  # Its own workflow, not a job in `ci`, so it doesn't gate the deploy until it has proven stable there. The last suite
  # (test/performance.mjs) holds boot, a typed hover, a 1000-file load and memory by realm to performance-budgets.json,
  # and warns on a rise since the last green run here — whose `performance` artifact is its baseline.
  #
  # Sharded: each suite file (or a few short ones together) on a runner of its own, so they run side by side without
  # sharing a CPU — the tour is three files, each in a session of its own (test/architecture-tour-session.mjs). The tour's
  # shards keep what they saw; `diagram` merges it and checks ARCHITECTURE.md's diagram against it.
  #
  # Selected (packages/editor/test/selection.mjs; packages/silo/README.md, *Which tests reach what*): only the shards a
  # change reached run, by what each test reached when it last ran — the records at the base (the commit before a push,
  # a pull request's merge base), so a change can't skip its own tests by editing them. Every shard but performance runs
  # instrumented (COVERAGE=1) and keeps what each of its tests reached; on main, `reach` folds that into the records and
  # commits them when they change.
  "jobs": {
    "select": {
      "runs-on": "ubuntu-latest",
      "outputs": {
        "matrix": "${{ steps.select.outputs.matrix }}",
        "any": "${{ steps.select.outputs.any }}",
        "tours": "${{ steps.select.outputs.tours }}"
      },
      "steps": [
        { "uses": "actions/checkout@v4", "with": { "fetch-depth": 0 } },
        { "uses": "brianjenkins94/lib/.github/actions/setup@main", "with": { "workspace-packages": "packages/*,components/*,contrib" } },
        {
          "id": "select",
          "run": "base=\"${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}\"\nif [ \"${{ github.event_name }}\" = pull_request ]; then base=$(git merge-base \"$base\" HEAD); fi\nmatrix=$(node packages/editor/test/selection.mjs select \"$base\")\necho \"matrix=$matrix\" >> \"$GITHUB_OUTPUT\"\necho \"any=$(echo \"$matrix\" | jq '.include | length > 0')\" >> \"$GITHUB_OUTPUT\"\necho \"tours=$(echo \"$matrix\" | jq '[.include[].shard | select(startswith(\"tour-\"))] | length == 3')\" >> \"$GITHUB_OUTPUT\""
        }
      ],
      "timeout-minutes": 10
    },
    "suites": {
      "name": "${{ matrix.shard }}",
      "needs": "select",
      "if": "${{ needs.select.outputs.any == 'true' }}",
      "runs-on": "ubuntu-latest",
      # actions: read, to download the last green run's performance results.
      "permissions": { "contents": "read", "actions": "read" },
      "strategy": {
        # Every shard runs to the end: a failure in one says nothing about the others.
        "fail-fast": false,
        # (selection.mjs's SHARDS: smoke-app, the three tours, and performance — alone, so nothing else shares the CPU
        # while it measures)
        "matrix": "${{ fromJSON(needs.select.outputs.matrix) }}"
      },
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "brianjenkins94/lib/.github/actions/setup@main", "with": { "workspace-packages": "packages/*,components/*,contrib" } },
        # The dev server the suites start (dev.ts) needs the monaco-vscode-api component's dist and the built sibling
        # packages; it prebuilds packages/editor itself (whose full build would need the component first anyway).
        { "run": "pnpm --recursive --if-present --filter '!./packages/editor' run build" },
        # Chromium, kept between runs (by the Playwright version that fetches it); and the system packages it needs only
        # when it lacks a library it links — the runner image has Chrome's. `--with-deps` installed them every time,
        # fonts and xvfb too, from an apt mirror that sometimes crawls: 20s on most runs, 11–12 minutes on a few shards on
        # 2026-10-22 (b72ada8, c716cd6), which ran their tests out of the job's 15.
        {
          "id": "playwright",
          "run": "echo \"version=$(pnpm --filter ./packages/editor exec playwright --version | awk '{print $2}')\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "uses": "actions/cache@v4",
          "with": { "path": "~/.cache/ms-playwright", "key": "playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium" }
        },
        { "run": "pnpm --filter ./packages/editor exec playwright install chromium" },
        {
          "run": "binaries=$(find ~/.cache/ms-playwright -type f \\( -name chrome -o -name headless_shell -o -name chrome-headless-shell \\) -perm -u+x)\nmissing=$(for binary in $binaries; do ldd \"$binary\"; done | grep 'not found' | sort -u || true)\nif [ -z \"$binaries\" ] || [ -n \"$missing\" ]; then echo \"Chromium lacks: ${missing:-(no binary found to check)}\"; pnpm --filter ./packages/editor exec playwright install-deps chromium; else echo \"Chromium has every library it links: $binaries\"; fi",
          "timeout-minutes": 6
        },
        # The baseline the performance suite compares against: the last green run on main's results (none on a first run).
        {
          "if": "${{ matrix.shard == 'performance' }}",
          "continue-on-error": true,
          "run": "id=$(gh run list --repo \"$GITHUB_REPOSITORY\" --workflow architecture --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')\nif [ -n \"$id\" ]; then gh run download \"$id\" --repo \"$GITHUB_REPOSITORY\" --name performance --dir /tmp/performance-baseline || echo \"run $id kept no performance results\"; fi",
          "env": { "GH_TOKEN": "${{ github.token }}" }
        },
        # The fixture app (architecture-app.mjs) installs hub and observability as tarballs: this commit's, not the
        # published ones (a change to either publishes only after ci passes, so @latest would race it). util-publish with CI
        # unset just packs them into docs/packages (no release); a static server hands them to the editor in the browser.
        {
          "if": "${{ matrix.shard == 'smoke-app' }}",
          "run": "CI= npx util-publish packages/hub packages/observability\n(npx -y http-server docs/packages -p 5198 --cors -c-1 --silent &)\nnpx -y wait-on -t 30000 http-get://localhost:5198/hub@0.0.0.tgz"
        },
        {
          "run": "pnpm --filter ./packages/editor exec node --test --test-concurrency=1 --test-global-setup=test/architecture-harness.mjs ${{ matrix.files }}",
          "env": {
            "GITHUB_REPOSITORY_OWNER": "${{ github.repository_owner }}",
            "ARCH_HUB_TGZ": "http://localhost:5198/hub@0.0.0.tgz",
            "ARCH_OBSERVABILITY_TGZ": "http://localhost:5198/observability@0.0.0.tgz",
            "PERF_BASELINE": "/tmp/performance-baseline/performance.json",
            # (what each test reaches, kept for selection — not while performance measures)
            "COVERAGE": "${{ matrix.shard != 'performance' && '1' || '' }}"
          }
        },
        # What each of its tests reached, for the records.
        {
          "if": "${{ matrix.shard != 'performance' }}",
          "uses": "actions/upload-artifact@v4",
          "with": { "name": "reach-${{ matrix.shard }}", "path": "/tmp/architecture-reach/*.json", "if-no-files-found": "error" }
        },
        # What a tour shard saw, for the diagram.
        {
          "if": "${{ startsWith(matrix.shard, 'tour-') }}",
          "uses": "actions/upload-artifact@v4",
          "with": { "name": "tour-seen-${{ matrix.shard }}", "path": "/tmp/architecture-tour-seen/*.json", "if-no-files-found": "error" }
        },
        # This run's results — the next one's baseline — and something to look at when a budget fails.
        {
          "if": "${{ always() && matrix.shard == 'performance' }}",
          "uses": "actions/upload-artifact@v4",
          "with": { "name": "performance", "path": "/tmp/performance.json", "if-no-files-found": "ignore" }
        },
        {
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@v4",
          "with": { "name": "architecture-snapshots-${{ matrix.shard }}", "path": "/tmp/architecture-*.json\n/tmp/architecture-*.png", "if-no-files-found": "ignore" }
        }
      ],
      "timeout-minutes": 15
    },
    # ARCHITECTURE.md's diagram, against what the tour's shards saw together — when every tour ran. No browser: a merge
    # and a render.
    "diagram": {
      "needs": ["select", "suites"],
      "if": "${{ needs.select.outputs.tours == 'true' }}",
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "brianjenkins94/lib/.github/actions/setup@main", "with": { "workspace-packages": "packages/*,components/*,contrib" } },
        {
          "uses": "actions/download-artifact@v4",
          "with": { "pattern": "tour-seen-*", "merge-multiple": true, "path": "/tmp/architecture-tour-seen" }
        },
        { "run": "pnpm --filter ./packages/editor run test:architecture:diagram" }
      ],
      "timeout-minutes": 15
    },
    # The records (.silo/evidence/ci/architecture.json): what each test that ran reached, folded in and committed when
    # it changed — on main, once every selected shard passed. CI's own evidence only (packages/silo/README.md, "Trust").
    "reach": {
      "needs": ["select", "suites"],
      "if": "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.suites.result == 'success' }}",
      "runs-on": "ubuntu-latest",
      "permissions": { "contents": "write" },
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "brianjenkins94/lib/.github/actions/setup@main", "with": { "workspace-packages": "packages/*,components/*,contrib" } },
        {
          "uses": "actions/download-artifact@v4",
          "with": { "pattern": "reach-*", "merge-multiple": true, "path": "/tmp/architecture-reach" }
        },
        # (read against this commit's files; committed on top of main as it is now — a push since is only rebased over)
        {
          "run": "node packages/editor/test/selection.mjs merge /tmp/architecture-reach\nif git diff --quiet -- .silo/evidence/ci/architecture.json && [ -z \"$(git status --porcelain -- .silo/evidence/ci/architecture.json)\" ]; then echo 'the reach is as it was'; exit 0; fi\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add .silo/evidence/ci/architecture.json\ngit commit -m \"the architecture suites' reach, from CI (${{ github.sha }})\"\nfor attempt in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done\nexit 1"
        }
      ],
      "timeout-minutes": 10
    }
  }
}
