{
  "name": "cd",
  "on": {
    "workflow_dispatch": null,
    # Fire automatically when CI finishes on main. workflow_run runs on the built-in GITHUB_TOKEN — no
    # PAT/dispatch hand-off needed; the job below gates on CI success (workflow_run fires on failure too).
    "workflow_run": {
      "workflows": ["ci"],
      "types": ["completed"],
      "branches": ["main"]
    }
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}"
  },
  # Must grant at least what the reusable deploy workflow needs (its token is the intersection).
  # contents:write lets util-publish cut + publish the `release` workspaces' GitHub releases; pages + id-token
  # are for the Pages deploy.
  "permissions": {
    "contents": "write",
    "pages": "write",
    "id-token": "write"
  },
  "jobs": {
    "cd": {
      # Only after a manual dispatch or a successful CI run on main.
      "if": "${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}",
      # lib's reusable app-deploy workflow: setup → run → pages-deploy(docs). workspace-packages makes CI an
      # ephemeral pnpm workspace so sibling packages link (bablr → its bablr-language-ts sibling). util-publish
      # builds every workspace (packages/editor's workbench app → docs/), then publishes the `release` workspaces'
      # tarballs, each onto its own GitHub release series (one draft; bump its package.json.version to publish) —
      # packages/editor's being the built site itself (its publishConfig.directory, docs/): what editor-contrib's
      # site unpacks, its extension added, to be an editor of its own.
      "uses": "brianjenkins94/lib/.github/workflows/deploy.yml@main",
      "with": {
        "run": "npx util-publish",
        "workspace-packages": "packages/*,components/*,contrib",
        "release": "packages/*,components/*"
      },
      "secrets": {
        "NPM_TOKEN": "${{ secrets.NPM_TOKEN }}"
      }
    },
    "dev": {
      # The API Worker's dev deployment (packages/api/README.md), after the same gate as the site. It stays off until
      # the repository variable CLOUDFLARE_ACCOUNT_ID exists, so the workflow is green before the Cloudflare account
      # is set up. The API token is a secret of the `dev` environment, scoped to Workers on this one
      # account; production deploys are production.yml, approval-gated (A7).
      "if": "${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && vars.CLOUDFLARE_ACCOUNT_ID != '' }}",
      "runs-on": "ubuntu-latest",
      "environment": "dev",
      "permissions": {
        "contents": "read"
      },
      "steps": [
        # The commit CI passed, not whatever main is by now.
        { "uses": "actions/checkout@v4", "with": { "ref": "${{ github.event.workflow_run.head_sha || github.sha }}" } },
        # Only the api package in the ephemeral workspace: the cooldown install, nothing else of the repo's.
        { "uses": "brianjenkins94/lib/.github/actions/setup@main", "with": { "workspace-packages": "packages/api" } },
        # The schema first: the Worker being deployed may need a migration the database hasn't had yet.
        {
          "run": "pnpm exec wrangler d1 migrations apply editor-api-dev --env dev --remote",
          "working-directory": "packages/api",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          }
        },
        {
          "run": "pnpm exec wrangler deploy --env dev",
          "working-directory": "packages/api",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          }
        }
      ],
      "timeout-minutes": 10
    }
  }
}
