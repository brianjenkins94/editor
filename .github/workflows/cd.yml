{
  "name": "cd",
  "on": {
    "workflow_dispatch": null,
    # Fire automatically when CI finishes on main. workflow_run runs on the built-in GITHUB_TOKEN — no
    # PAT/dispatch hand-off needed; the job below gates on CI success (workflow_run fires on failure too).
    "workflow_run": {
      "workflows": ["ci"],
      "types": ["completed"],
      "branches": ["main"]
    }
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}"
  },
  # Must grant at least what the reusable deploy workflow needs (its token is the intersection).
  # contents:write lets the reusable deploy's opt-in release step cut GitHub releases (util-release) — see
  # `release: true` below; pages + id-token are for the Pages deploy.
  "permissions": {
    "contents": "write",
    "pages": "write",
    "id-token": "write"
  },
  "jobs": {
    "cd": {
      # Only after a manual dispatch or a successful CI run on main.
      "if": "${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}",
      # lib's reusable app-deploy workflow: setup → run → pages-deploy(docs). workspace-packages makes CI an
      # ephemeral pnpm workspace so sibling packages link (bablr → its bablr-language-ts sibling). util-publish
      # builds every workspace (the private workbench app → docs/) then publishes tarballs for packages with a
      # GitHub release (others just build), so it's safe on every push.
      "uses": "brianjenkins94/lib/.github/workflows/deploy.yml@main",
      "with": {
        "run": "npx util-publish",
        "workspace-packages": "packages/*,components/*",
        "release": true
      },
      "secrets": {
        "NPM_TOKEN": "${{ secrets.NPM_TOKEN }}"
      }
    }
  }
}
