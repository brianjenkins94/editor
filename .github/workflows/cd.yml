{
  "name": "cd",
  "on": {
    "workflow_dispatch": null,
    # Fire automatically when CI finishes on main. workflow_run runs on the built-in GITHUB_TOKEN — no
    # PAT/dispatch hand-off needed. The publish job gates on CI success (workflow_run fires on failure too).
    "workflow_run": {
      "workflows": ["ci"],
      "types": ["completed"],
      "branches": ["main"]
    }
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}"
  },
  # pages + id-token for the Pages deploy; id-token also carries npm provenance.
  "permissions": {
    "contents": "read",
    "pages": "write",
    "id-token": "write"
  },
  "jobs": {
    "publish": {
      # Only after a manual dispatch or a successful CI run on main.
      "if": "${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}",
      "runs-on": "ubuntu-latest",
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deploy.outputs.page_url }}"
      },
      "steps": [
        { "uses": "actions/checkout@v4" },
        # lib's published setup action (pnpm + cooldown install), then its published pages-deploy action.
        { "uses": "brianjenkins94/lib/.github/actions/setup@main" },
        # Build first: util-build runs every workspace's build, so the workbench app (packages/vscode) emits the
        # docs/ site that gets deployed. (private ≠ don't build — util-build builds it; util-publish skips it.)
        { "run": "pnpm run build" },
        # Then publish: util-publish builds each NON-private package from source (vite), writes docs/*.tgz, and
        # publishes to npm (provenance) when NPM_TOKEN is present. Runs per successful CI; only packages with a
        # GitHub release actually publish (others just build), so this is safe on every push.
        {
          "run": "npx util-publish",
          "env": {
            "NPM_TOKEN": "${{ secrets.NPM_TOKEN }}",
            "GITHUB_REPOSITORY_OWNER": "${{ github.repository_owner }}"
          }
        },
        {
          "id": "deploy",
          "uses": "brianjenkins94/lib/.github/actions/pages-deploy@main",
          "with": { "path": "docs" }
        }
      ],
      "timeout-minutes": 15
    }
  }
}
