{
  "name": "ci",
  "on": {
    "pull_request": {
      "branches": ["main"]
    },
    "push": {
      "branches": ["main"]
    },
    "workflow_call": {}
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "build-lint": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "script": ["build", "lint", "test"]
        }
      },
      "steps": [
        { "uses": "actions/checkout@v4" },
        # lib's published composite action: setup-node + pnpm + store cache + allowBuilds + cooldown install.
        # workspace-packages makes CI an ephemeral pnpm workspace (editor uses npm locally, no committed
        # pnpm-workspace.yaml) so sibling packages link — a `"*"` dep on a sibling resolves locally, not 404.
        { "uses": "brianjenkins94/lib/.github/actions/setup@main", "with": { "workspace-packages": "packages/*,components/*" } },
        { "run": "pnpm run --if-present ${{ matrix.script }}" }
      ],
      "timeout-minutes": 15
    }
  }
}
