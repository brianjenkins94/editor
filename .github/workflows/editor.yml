{
  "name": "Editor",
  "on": {
    "push": {
      "branches": ["main"]
    },
    "pull_request": null
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        {
          "uses": "actions/setup-node@v4",
          "with": { "node-version": 22 }
        },
        {
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": "latest",
            "run_install": false
          }
        },
        # No committed lockfile; util-postinstall installs every non-private workspace with a release-age floor.
        { "run": "npm install --no-audit --no-fund" },
        { "name": "Lint", "run": "npx util-lint" },
        # Builds each package from source — vite for the bablr wrapper (bundles + neutralizes record validation).
        { "name": "Build", "run": "npx util-build" }
      ],
      "timeout-minutes": 15
    }
  }
}
