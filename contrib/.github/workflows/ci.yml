{
  "name": "ci",
  # Build and test on every push and pull request; on main, publish to GitHub Pages the editor with this extension in it —
  # the editor's own build (its package, editor@latest.tgz: the editor's current release, or main until its first), the
  # extension added under extensions/contrib/ and listed in extensions.json — so https://<owner>.github.io/<repo>/ is the
  # editor, Run starting this interpreter. Weekly too, to pick up the editor's releases. A fork needs nothing but Settings → Pages → Source: GitHub Actions.
  "on": {
    "push": {
      "branches": ["main"]
    },
    "pull_request": {
      "branches": ["main"]
    },
    "schedule": [
      { "cron": "0 6 * * 1" }
    ],
    "workflow_dispatch": null
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": "${{ github.event_name == 'pull_request' }}"
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "actions/setup-node@v4", "with": { "node-version": "lts/*" } },
        { "run": "npm install" },
        { "run": "npm run build" },
        { "run": "npm run lint" },
        { "run": "npm test" },
        { "run": "mkdir -p _site/extensions/contrib\ncurl --fail --silent --show-error --location https://brianjenkins94.github.io/editor/packages/editor@latest.tgz | tar --extract --gzip --strip-components=1 --directory _site\ncp -R package.json dist _site/extensions/contrib/\necho '[\"extensions/contrib/\"]' > _site/extensions.json" },
        { "uses": "actions/upload-pages-artifact@v3", "with": { "path": "_site" } }
      ],
      "timeout-minutes": 10
    },
    "deploy": {
      "needs": "build",
      "if": "${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "pages": "write",
        "id-token": "write"
      },
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        { "id": "deployment", "uses": "actions/deploy-pages@v4" }
      ],
      "timeout-minutes": 10
    }
  }
}
